<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koreksi Murojaah Hafalan AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
  <style>
    .font-arabic { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 sm:p-6">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 p-6">
    
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-700">Korektor Murojaah AI</h1>
      <p class="text-sm text-slate-500 mt-1">Unggah rekaman audio hafalanmu untuk dianalisis oleh AI.</p>
    </header>

    <!-- Input Informasi Target -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-slate-700 mb-1">Target Surah / Ayat</label>
      <input type="text" id="targetSurah" placeholder="Contoh: Surah Al-Mulk ayat 1-10" 
        class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>

    <!-- Area Upload File Audio -->
    <div class="bg-slate-50 p-6 rounded-xl border border-dashed border-slate-300 text-center mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">Pilih File Audio Rekaman</label>
      
      <input type="file" id="audioFileInput" accept="audio/*" onchange="handleFileSelect(event)" class="hidden">
      
      <button onclick="document.getElementById('audioFileInput').click()" 
        class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium transition inline-flex items-center gap-2">
        <span>📁</span> Pilih File Audio (.mp3, .m4a, .wav)
      </button>

      <p id="fileNameDisplay" class="text-xs text-slate-500 mt-2 italic">Belum ada file yang dipilih</p>

      <!-- Player Preview -->
      <audio id="audioPreview" controls class="w-full mt-4 hidden"></audio>
    </div>

    <!-- Tombol Kirim -->
    <button id="btnAnalyze" onclick="sendAudioToGAS()" disabled 
      class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white py-3 rounded-xl font-semibold transition">
      Koreksi Hafalan Sekarang
    </button>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden text-center py-8">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
      <p class="text-slate-600 text-sm mt-3">Sedang menganalisis audio hafalan...</p>
    </div>

    <!-- Hasil Koreksi -->
    <div id="resultContainer" class="mt-8 hidden border-t pt-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800">Hasil Koreksi</h2>
        <span id="statusBadge" class="px-3 py-1 rounded-full text-xs font-semibold"></span>
      </div>

      <!-- Ringkasan AI -->
      <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl mb-4 text-sm text-emerald-900">
        <p class="font-semibold mb-1">Catatan Penguji:</p>
        <p id="ringkasanText"></p>
      </div>

      <!-- Transkripsi Arab -->
      <div class="mb-6">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Terdeteksi Dibaca:</h3>
        <p id="transkripsiText" class="font-arabic text-2xl text-right leading-loose bg-slate-50 p-4 rounded-xl border" dir="rtl"></p>
      </div>

      <!-- Detail Kesalahan -->
      <div>
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Rincian Perbaikan:</h3>
        <div id="kesalahanList" class="space-y-3"></div>
      </div>
    </div>

  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzFmHspd31V3Kh1W3dO9x4ncQ81v-2y_04UdUpnKqttF3xLE6tBpfVx1wTI2eO5-12y/exec";
    
    let selectedFile = null;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Batasi ukuran maksimal 10MB agar tidak melebih batas beban GAS
      if (file.size > 10 * 1024 * 1024) {
        alert("Ukuran file terlalu besar (maksimal 10 MB). Pilih audio yang lebih pendek.");
        return;
      }

      selectedFile = file;
      document.getElementById('fileNameDisplay').innerText = `File terpilih: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;

      const audioPlayer = document.getElementById('audioPreview');
      audioPlayer.src = URL.createObjectURL(file);
      audioPlayer.classList.remove('hidden');

      document.getElementById('btnAnalyze').disabled = false;
    }

    async function sendAudioToGAS() {
      if (!selectedFile) return;

      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('resultContainer').classList.add('hidden');
      document.getElementById('btnAnalyze').disabled = true;

      const reader = new FileReader();
      reader.readAsDataURL(selectedFile);
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        const surah = document.getElementById('targetSurah').value || 'Surah Umum';

        try {
          const response = await fetch(GAS_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8', // Mengakali batasan CORS Google Apps Script
            },
            body: JSON.stringify({
              audio: base64Audio,
              mimeType: selectedFile.type || 'audio/mp3',
              surah: surah
            })
          });

          const res = await response.json();
          if (res.success) {
            renderResult(res.data);
          } else {
            alert('Gagal mengoreksi: ' + (res.error || 'Terjadi kesalahan sistem AI.'));
          }
        } catch (err) {
          alert('Terjadi kesalahan koneksi CORS/Network: ' + err.message);
        } finally {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('btnAnalyze').disabled = false;
        }
      };
    }

    function renderResult(data) {
      document.getElementById('resultContainer').classList.remove('hidden');
      
      const badge = document.getElementById('statusBadge');
      badge.innerText = data.status || "Selesai";
      badge.className = data.status === "Sempurna" 
        ? "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800"
        : "px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800";

      document.getElementById('ringkasanText').innerText = data.ringkasan || "-";
      document.getElementById('transkripsiText').innerText = data.transkripsi || "-";

      const listContainer = document.getElementById('kesalahanList');
      listContainer.innerHTML = '';

      if (!data.kesalahan || data.kesalahan.length === 0) {
        listContainer.innerHTML = `<p class="text-sm text-slate-500 italic">Tidak ada kesalahan yang terdeteksi. Masya Allah!</p>`;
      } else {
        data.kesalahan.forEach(item => {
          const card = document.createElement('div');
          card.className = "p-4 bg-slate-50 rounded-xl border border-slate-200 text-sm";
          card.innerHTML = `
            <div class="flex justify-between items-center mb-2">
              <span class="font-semibold text-rose-600 bg-rose-50 px-2.5 py-0.5 rounded text-xs">${item.jenis}</span>
            </div>
            <p class="text-slate-700"><strong>Dibaca:</strong> <span class="font-arabic text-lg text-slate-900">${item.posisi}</span></p>
            <p class="text-emerald-700 mt-1"><strong>Seharusnya:</strong> <span class="font-arabic text-lg">${item.seharusnya}</span></p>
            <p class="text-xs text-slate-500 mt-2 border-t pt-2">${item.penjelasan}</p>
          `;
          listContainer.appendChild(card);
        });
      }
    }
  </script>
</body>
</html>
