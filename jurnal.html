<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Fuqohak Studio - Google Docs & Zotero Direct</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-600 rounded-lg">
        <i class="fa-solid fa-graduation-cap text-xl text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-white">Jurnal Fuqohak Studio</h1>
        <p class="text-xs text-slate-400">APA 7th Edition • Gemini 2.5 Flash • Direct Google Docs Export</p>
      </div>
    </div>
    
    <!-- MAIN EXPORT BUTTON -->
    <button onclick="exportToGoogleDocs()" id="btnExport" disabled class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 text-white text-sm font-semibold rounded-xl transition-all flex items-center gap-2 shadow-lg shadow-blue-600/30">
      <i class="fa-solid fa-file-word"></i>
      <span>Buka di Google Docs (Siap Edit & Zotero)</span>
    </button>
  </header>

  <main class="max-w-[1500px] mx-auto p-6 space-y-6">

    <!-- FORM INPUT -->
    <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 space-y-4 shadow-xl">
      <h2 class="font-semibold text-slate-200 flex items-center gap-2 border-b border-slate-700/60 pb-3">
        <i class="fa-solid fa-pen-nib text-indigo-400"></i> Form Struktur Artikel Jurnal
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            1. Judul Penelitian / Artikel <span class="text-red-400">*</span>
          </label>
          <input type="text" id="paperTitle" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none placeholder-slate-600" placeholder="Ketik judul penelitian Anda...">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            2. Rumusan Masalah / Pertanyaan Penelitian <span class="text-red-400">*</span>
          </label>
          <input type="text" id="researchQuestions" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none placeholder-slate-600" placeholder="Ketik pertanyaan penelitian Anda...">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          3. Bahan Mentah & Referensi Lengkap (Buku/Jurnal)
        </label>
        <textarea id="rawNotes" rows="5" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none placeholder-slate-600 resize-none" placeholder="Masukkan argumen, kutipan, dan referensi mentah Anda..."></textarea>
      </div>

      <button onclick="generatePaper()" id="btnGenerate" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Sintesis Artikel Jurnal Akurat</span>
      </button>
    </section>

    <!-- STATUS LOG -->
    <div id="statusBox" class="hidden p-4 rounded-xl bg-indigo-950/80 border border-indigo-800 text-indigo-200 text-sm flex items-center gap-3">
      <i class="fa-solid fa-spinner animate-spin text-lg"></i>
      <span id="statusText">Memproses artikel...</span>
    </div>

    <!-- OUTPUT AREA -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- ENGLISH DRAFT -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 flex flex-col gap-3">
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <h2 class="font-semibold text-indigo-400 flex items-center gap-2">
            <i class="fa-solid fa-globe"></i> English Academic Paper (APA 7th Format)
          </h2>
          <button onclick="copyEnglishText()" class="text-xs bg-slate-900 border border-slate-700 hover:bg-slate-800 px-3 py-1.5 rounded-lg text-slate-300 flex items-center gap-1.5">
            <i class="fa-regular fa-copy"></i> Salin Teks
          </button>
        </div>
        <div id="englishOutput" class="flex-1 bg-slate-950 border border-slate-700/80 rounded-xl p-5 text-slate-300 text-sm leading-relaxed max-h-[600px] overflow-y-auto prose prose-invert max-w-none">
          <p class="text-slate-600 italic">Naskah Bahasa Inggris akan tampil di sini...</p>
        </div>
      </div>

      <!-- INDONESIAN DRAFT -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 flex flex-col gap-3">
        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
          <h2 class="font-semibold text-emerald-400 flex items-center gap-2">
            <i class="fa-solid fa-book-open"></i> Versi Bahasa Indonesia
          </h2>
        </div>
        <textarea id="indonesianOutput" rows="22" readonly class="w-full bg-slate-950 border border-slate-700/80 rounded-xl p-5 text-slate-300 text-sm leading-relaxed focus:outline-none resize-none" placeholder="Terjemahan Bahasa Indonesia akan muncul di sini..."></textarea>
      </div>

    </section>

  </main>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvWp1Pd-_-l1YU2z96gAzGV2xhqkR9d-Bx7h58Fma-OdFKgbDu4RstlfuQiUsHqEqs/exec";
    let englishRawText = "";

    async function generatePaper() {
      const title = document.getElementById("paperTitle").value.trim();
      const questions = document.getElementById("researchQuestions").value.trim();
      const notes = document.getElementById("rawNotes").value.trim();

      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const btnGenerate = document.getElementById("btnGenerate");
      const englishOutput = document.getElementById("englishOutput");
      const indonesianOutput = document.getElementById("indonesianOutput");
      const btnExport = document.getElementById("btnExport");

      if (!title || !questions) {
        alert("Mohon isi Judul Penelitian dan Rumusan Masalah terlebih dahulu.");
        return;
      }

      const structuredPayload = `
[PAPER STRUCTURE REQUIREMENT]
TITLE: ${title}
RESEARCH QUESTIONS: ${questions}

[RAW NOTES & REFERENCES]
${notes}
      `;

      statusBox.classList.remove("hidden");
      statusText.innerText = "Sistem sedang menyusun artikel akademis...";
      btnGenerate.disabled = true;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "generateJournal", prompt: structuredPayload })
        });

        const res = await response.json();
        if (res.success) {
          englishRawText = res.data.english;
          englishOutput.innerHTML = marked.parse(englishRawText);
          indonesianOutput.value = res.data.indonesian;

          btnExport.disabled = false;
          statusBox.classList.add("hidden");
        } else {
          statusText.innerText = "Error: " + res.error;
        }
      } catch (err) {
        statusText.innerText = "Error: " + err.message;
      } finally {
        btnGenerate.disabled = false;
      }
    }

    function copyEnglishText() {
      if (!englishRawText) return;
      navigator.clipboard.writeText(englishRawText);
      alert("Teks naskah berhasil disalin!");
    }

    async function exportToGoogleDocs() {
      if (!englishRawText) return;
      const title = document.getElementById("paperTitle").value.trim() || "Academic_Journal";
      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");

      statusBox.classList.remove("hidden");
      statusText.innerText = "Membuat dokumen Google Docs profesional... Mohon tunggu sebentar.";

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "exportDocx", title: title, content: englishRawText })
        });

        const res = await response.json();
        if (res.success && res.fileUrl) {
          window.open(res.fileUrl, "_blank");
          statusBox.classList.add("hidden");
        } else {
          statusText.innerText = "Gagal membuat dokumen: " + (res.error || "Error.");
        }
      } catch (err) {
        statusText.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
