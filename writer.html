<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; font-family:'Inter', sans-serif; color:white; overflow:hidden; }
  
  .topbar { 
    position:sticky; top:0; background:#111827; padding:15px 24px; 
    display:flex; align-items:center; gap:12px; 
    border-bottom:1px solid rgba(255,255,255,.08); z-index:9999; 
  }
  .logo { font-size:20px; font-weight:700; color:#ffd54f; }
  .btn { 
    border:none; background:#2563eb; color:white; padding:10px 18px; 
    border-radius:10px; cursor:pointer; font-weight:600; transition:0.2s; 
  }
  .btn:hover { background:#1d4ed8; }
  #status { margin-left:auto; color:#22c55e; font-weight:700; }

  .popup { 
    position:fixed; inset:0; background:rgba(0,0,0,.6); 
    display:none; justify-content:center; align-items:center; z-index:999999; 
  }
  .popup-content { 
    width:90%; max-width:600px; background:white; color:black; 
    border-radius:20px; padding:25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .popup input { 
    width:100%; padding:14px; font-size:16px; border-radius:10px; 
    border:2px solid #e2e8f0; margin-bottom:15px; outline:none;
  }
  .popup input:focus { border-color: #2563eb; }
  .results { max-height:250px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:10px; }
  .result-item { padding:14px; border-bottom:1px solid #edf2f7; cursor:pointer; }
  .result-item:hover { background:#f1f5f9; }
  .loading { padding:15px; text-align:center; color:#64748b; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">The Sanctum Writer</div>
  <button class="btn" onclick="openCitationPopup()">+ Citation</button>
  <button class="btn" style="background:#16a34a;" onclick="saveDoc()">🚀 Save</button>
  <div id="status">Ready</div>
</div>

<textarea id="editor"></textarea>

<div class="popup" id="citationPopup">
  <div class="popup-content">
    <input id="citationSearch" placeholder="Cari kitab, buku, atau nama penulis di Zotero...">
    <div id="citationResults" class="results"></div>
    <div style="display:flex; justify-content:flex-end; margin-top:15px;">
      <button class="btn" style="background:#64748b;" onclick="closePopup()">Batal</button>
    </div>
  </div>
</div>

<script>
// MASUKKAN URL WEB APP GOOGLE SCRIPT ANDA DI SINI
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwBpMs5amqJTgaxA48FRiZospxk-IhSpPUEttRplSQGJ7PqLRHwv8UKPq1x_5V9kir8/exec"; 

let footnotes = [];

tinymce.init({
  selector: '#editor',
  height: 'calc(100vh - 73px)',
  menubar: true,
  branding: false,
  plugins: 'lists link table image code',
  toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline | alignleft aligncenter alignright justify | bullist numlist | table code',
  content_style: `
    body { font-family: "Times New Roman", Times, serif; font-size: 19px; line-height: 1.8; max-width: 800px; margin: auto; padding: 40px; color: #111827; background: #ffffff; }
    p { margin-bottom: 1em; text-align: justify; }
    sup { color: #2563eb; font-weight: bold; }
  `
});

function openCitationPopup(){
  document.getElementById("citationPopup").style.display = "flex";
  document.getElementById("citationSearch").focus();
}

function closePopup(){
  document.getElementById("citationPopup").style.display = "none";
}

document.getElementById("citationSearch").addEventListener("input", function(){
  const q = this.value.trim();
  if(q.length < 3) {
    document.getElementById("citationResults").innerHTML = "";
    return;
  }
  document.getElementById("citationResults").innerHTML = '<div class="loading">Searching Zotero...</div>';
  
  // Menggunakan Fetch API ke Google Apps Script
  fetch(GAS_API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain" // Menghindari CORS preflight issue pada Google Apps Script
    },
    body: JSON.stringify({
      action: "search",
      query: q
    })
  })
  .then(response => response.json())
  .then(res => {
    if (res.status === "SUCCESS") {
      renderResults(res.data);
    } else {
      renderResults([]);
    }
  })
  .catch(err => {
    console.error("Error search:", err);
    renderResults([]);
  });
});

function renderResults(results){
  const container = document.getElementById("citationResults");
  container.innerHTML = "";
  if (!results || results.length === 0) {
    container.innerHTML = '<div class="loading">Data tidak ditemukan.</div>';
    return;
  }
  results.forEach(r => {
    const div = document.createElement("div");
    div.className = "result-item";
    div.innerHTML = `<b>${r.title}</b><br><small style="color:#64748b">${r.author} (${r.year})</small>`;
    div.onclick = function(){ insertCitation(r); };
    container.appendChild(div);
  });
}

function insertCitation(data){
  const number = footnotes.length + 1;
  const note = `${data.author}, ${data.title} (${data.year})`;

  footnotes.push({ number: number, note: note });
  tinymce.get("editor").insertContent(`<sup>${number}</sup>`);
  
  closePopup();
  document.getElementById("citationSearch").value = "";
  document.getElementById("citationResults").innerHTML = "";
}

function saveDoc(){
  const status = document.getElementById("status");
  status.innerHTML = "Saving...";
  status.style.color = "#3b82f6";

  const html = tinymce.get("editor").getContent();
  const safeFootnotes = JSON.stringify(footnotes);

  // Menggunakan Fetch API ke Google Apps Script
  fetch(GAS_API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain" // Menghindari CORS preflight issue pada Google Apps Script
    },
    body: JSON.stringify({
      action: "save",
      html: html,
      footnotesRaw: safeFootnotes
    })
  })
  .then(response => response.json())
  .then(res => {
    if (res.status === "SUCCESS") {
      status.innerHTML = "Saved ✓";
      status.style.color = "#22c55e";
    } else {
      status.innerHTML = "Failed ❌";
      status.style.color = "#ef4444";
      console.error(res.message || res);
    }
    setTimeout(function(){ status.innerHTML = "Ready"; status.style.color = "#22c55e"; }, 2500);
  })
  .catch(err => {
    status.innerHTML = "Failed ❌";
    status.style.color = "#ef4444";
    console.error("Error save:", err);
    setTimeout(function(){ status.innerHTML = "Ready"; status.style.color = "#22c55e"; }, 2500);
  });
}
</script>
</body>
</html>
