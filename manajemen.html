<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manajemen - Fuqohak Executive Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #050b14;
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- HEADER NAVIGASI -->
  <header class="bg-slate-900/90 border-b border-slate-800 p-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <a href="index.html" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition duration-200">
        ⬅ Kembali
      </a>
      <h1 class="text-xs font-black tracking-tight uppercase text-slate-200">Panel Manajemen</h1>
    </div>
    <span class="text-[9px] font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-full">INTEGRATED</span>
  </header>

  <!-- CONTAINER IFRAME -->
  <div class="flex-1 w-full bg-slate-950 relative">
    <iframe 
      src="https://manajemen.ppmuy.com" 
      class="absolute inset-0 w-full h-full border-none"
      title="Manajemen PPMUY"
      allow="geolocation; microphone; camera; midi; encrypted-media; autoplay"
      loading="lazy">
    </iframe>
  </div>

</body>
</html>
