<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lifestyle Tracker - Mas Fuqohak</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">

    <div class="max-w-md mx-auto p-4 space-y-6 pb-24">
        
        <header class="flex justify-between items-center bg-slate-800/50 backdrop-blur-md p-4 rounded-2xl border border-slate-700/50 shadow-xl">
            <div>
                <h1 class="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
                    <span>🌟</span> AI Tracker
                </h1>
                <p id="date-masehi" class="text-xs text-slate-400 mt-0.5">Memuat tanggal...</p>
            </div>
            <div class="text-right bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-xl">
                <span id="date-hijriah" class="text-xs font-bold text-emerald-400 block">⏳ Menghitung...</span>
            </div>
        </header>

        <section class="bg-gradient-to-br from-slate-800 to-slate-850 p-5 rounded-3xl border border-slate-700/60 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full blur-2xl"></div>
            
            <div class="flex items-center gap-3 mb-4">
                <div class="p-2.5 bg-emerald-500/10 rounded-xl border border-emerald-500/20 text-xl">📸</div>
                <div>
                    <h2 class="text-base font-bold text-white leading-tight">AI Food & Meal Scanner</h2>
                    <p class="text-xs text-slate-400">Foto atau upload makanan untuk hitung kalori otomatis</p>
                </div>
            </div>

            <div class="relative bg-slate-950 rounded-2xl border-2 border-dashed border-slate-700/80 overflow-hidden group aspect-video flex flex-col justify-center items-center p-4">
                <video id="camera-video" class="hidden absolute inset-0 w-full h-full object-cover"></video>
                <img id="image-preview" class="hidden absolute inset-0 w-full h-full object-cover" />
                
                <div id="upload-placeholder" class="text-center space-y-2 group-hover:scale-105 transition duration-300">
                    <span class="text-3xl block">🍲</span>
                    <span class="text-xs font-semibold text-slate-400 block">Belum ada foto makanan</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-4">
                <button id="btn-camera" onclick="toggleKamera()" class="bg-slate-700 hover:bg-slate-650 text-white font-bold py-3 px-4 rounded-xl text-xs transition active:scale-95 flex justify-center items-center gap-2 border border-slate-600/50">
                    <span id="cam-icon">📷</span> <span id="cam-text">Buka Kamera</span>
                </button>
                
                <label class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl text-xs transition active:scale-95 flex justify-center items-center gap-2 cursor-pointer text-center shadow-lg shadow-emerald-900/20">
                    <span>📤</span> Upload Galeri
                    <input type="file" id="file-input" accept="image/*" onchange="previewFile()" class="hidden">
                </label>
            </div>

            <button id="btn-proses-ai" onclick="prosesMakananDenganAI()" class="w-full mt-3 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-extrabold py-3.5 rounded-xl text-xs transition shadow-lg disabled:opacity-40 disabled:cursor-not-allowed uppercase tracking-wider border-b-4 border-amber-700 active:border-b-0 hidden">
                🔥 Analisis Kalori via AI
            </button>
        </section>

        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
                <span class="text-slate-400 text-[10px] uppercase font-bold tracking-wider block">Kalori Masuk</span>
                <span id="val-kalori-masuk" class="text-xl font-extrabold text-emerald-400 block mt-0.5">0 kcal</span>
            </div>
            <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
                <span class="text-slate-400 text-[10px] uppercase font-bold tracking-wider block">Air Minum</span>
                <span id="val-minum" class="text-xl font-extrabold text-blue-400 block mt-0.5">0 ml</span>
            </div>
            <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
                <span class="text-slate-400 text-[10px] uppercase font-bold tracking-wider block">Menulis</span>
                <span id="val-menulis" class="text-xl font-extrabold text-amber-400 block mt-0.5">0 Kata</span>
            </div>
            <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
                <span class="text-slate-400 text-[10px] uppercase font-bold tracking-wider block">English Track</span>
                <span id="val-english" class="text-xl font-extrabold text-indigo-400 block mt-0.5">0 Menit</span>
            </div>
        </section>

        <section class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Evaluasi & Rekomendasi AI</h3>
            <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-700/30">
                <p id="ai-rekomendasi" class="text-xs italic text-slate-300 leading-relaxed">"Memuat rekomendasi kesehatan dari AI..."</p>
            </div>
        </section>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz4WIiha9JSemWqoC4603207orwCm3eYd3XlMwXzNZBTLHvWsITLlyecHnjB4hvr-i03w/exec";
        let streamKamera = null;

        // FUNGSI KALENDER HIJRIAH OTOMATIS ONLINE (SISTEM UMMUL QURA / KEMENAG)
        function hitungKalenderHijriahAkurat() {
            const sekarang = new Date();
            
            // 1. Tampilkan Tanggal Masehi Komputer
            const opsiMasehi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById("date-masehi").innerText = sekarang.toLocaleDateString('id-ID', opsiMasehi);
            
            // 2. Tampilkan Tanggal Hijriah Sinkronisasi Otomatis
            try {
                const opsiHijriah = { day: 'numeric', month: 'long', year: 'numeric' };
                const formatterHijriah = new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura', opsiHijriah);
                document.getElementById("date-hijriah").innerText = formatterHijriah.format(sekarang) + " H";
            } catch (e) { 
                document.getElementById("date-hijriah").innerText = "Dzulhijjah 1447 H"; 
            }
        }

        // FITUR SINKRONISASI DATA DARI SPREADSHEET
        async function loadDashboardData() {
            try {
                const res = await fetch(API_URL + "?aksi=getTrackerData");
                const json = await res.json();
                if(json.status === "success" || json.data) {
                    const data = json.data || json;
                    document.getElementById('val-kalori-masuk').innerText = (data["KALORI MASUK"]?.value || 0) + " kcal";
                    document.getElementById('val-minum').innerText = (data["MINUM AIR"]?.value || 0) + " ml";
                    document.getElementById('val-menulis').innerText = (data["MENULIS"]?.value || 0) + " Kata";
                    document.getElementById('val-english').innerText = (data["ENGLISH"]?.value || 0) + " Menit";
                    if(data["REKOMENDASI"]) {
                        document.getElementById('ai-rekomendasi').innerText = data["REKOMENDASI"];
                    }
                }
            } catch(e) { console.error("Gagal sinkronisasi data sheet:", e); }
        }

        // FITUR KAMERA JALAN
        async function toggleKamera() {
            const video = document.getElementById('camera-video');
            const preview = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');
            const btnText = document.getElementById('cam-text');
            const btnIcon = document.getElementById('cam-icon');

            if (streamKamera) {
                // Ambil gambar dari kamera
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                preview.src = canvas.toDataURL('image/jpeg');
                preview.classList.remove('hidden');
                
                // Matikan kamera kembali
                streamKamera.getTracks().forEach(track => track.stop());
                streamKamera = null;
                video.classList.add('hidden');
                btnText.innerText = "Buka Kamera";
                btnIcon.innerText = "📷";
                document.getElementById('btn-proses-ai').classList.remove('hidden');
            } else {
                // Nyalakan Kamera
                try {
                    preview.classList.add('hidden');
                    placeholder.classList.add('hidden');
                    streamKamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    video.srcObject = streamKamera;
                    video.classList.remove('hidden');
                    video.play();
                    btnText.innerText = "Ambil Foto";
                    btnIcon.innerText = "📸";
                } catch (err) {
                    alert("Akses kamera ditolak atau tidak didukung.");
                }
            }
        }

        // FITUR PREVIEW DARI UPLOAD FILE GALERI
        function previewFile() {
            const file = document.getElementById('file-input').files[0];
            const preview = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');
            const video = document.getElementById('camera-video');

            if (file) {
                if(streamKamera) {
                    streamKamera.getTracks().forEach(track => track.stop());
                    streamKamera = null;
                    video.classList.add('hidden');
                    document.getElementById('cam-text').innerText = "Buka Kamera";
                    document.getElementById('cam-icon').innerText = "📷";
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    document.getElementById('btn-proses-ai').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // FITUR KIRIM KE AI SPREADSHEET UNTUK SCAN MAKANAN AUTOMATIS
        async function prosesMakananDenganAI() {
            const btn = document.getElementById('btn-proses-ai');
            const preview = document.getElementById('image-preview');
            if(!preview.src) return;

            btn.disabled = true;
            btn.innerText = "⚡ MENGANALISIS MAKANAN VIA AI...";

            try {
                const payload = {
                    aksi: "scanMakananAI",
                    image_base64: preview.src
                };

                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const hasil = await res.json();

                if(hasil.status === "success") {
                    alert(`AI Sukses mendeteksi menu Anda! Kalori otomatis bertambah.`);
                    loadDashboardData();
                } else {
                    alert("AI gagal membaca gambar: " + hasil.message);
                }
            } catch(e) {
                alert("Koneksi terputus saat menghubungi AI.");
            } finally {
                btn.disabled = false;
                btn.innerText = "🔥 Analisis Kalori via AI";
            }
        }

        // INITIAL LOAD SYSTEM
        window.onload = function() {
            hitungKalenderHijriahAkurat();
            loadDashboardData();
            // Loop penyegaran data berkala
            setInterval(hitungKalenderHijriahAkurat, 60000);
        }
    </script>
</body>
</html>
