<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nutrition Tracker - Jomblo Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">

    <nav class="bg-white dark:bg-slate-800 shadow-sm py-4 px-6 mb-4 border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600 dark:text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse text-amber-500 animate-pulse"></i> Nutrition Tracker
            </h1>
            <button id="themeToggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 pb-12">
        <script>
            // GANTI URL INI DENGAN URL WEB APP ANDA SETELAH DEPLOY
            const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxyR-YR6cfWMYrvgZsavVqWCZVDh_FFIdyDDTWWIzM4SxibMkDAdNlOaA2T3pCa1SpA/exec"; 
        </script>

        <!-- SEKSI AI ADVICE (AUTO-UPDATE & FAST) -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-blue-500/20 shadow-sm p-5 mb-6">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center text-blue-600 text-xl">
                    <i class="fa-solid fa-hat-chef"></i>
                </div>
                <div class="flex-1">
                    <h2 id="aiAdviceTitle" class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-1">Memuat Rekomendasi...</h2>
                    <p id="aiMotivationText" class="text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1 italic">"Menganalisis waktu dan menu terbaik untukmu..."</p>
                    <div class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-lg border border-slate-100 dark:border-slate-700 mt-2">
                        <span class="text-[10px] font-bold text-emerald-500 uppercase block mb-1">Ide Masak Jomblo (Cepat & Sehat):</span>
                        <p id="aiRecipeText" class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- INPUT SECTION -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-md mb-8">
            <div class="flex gap-2 mb-6 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
                <button id="tabCamera" class="flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-slate-800 shadow text-blue-600">Foto</button>
                <button id="tabWrite" class="flex-1 py-2 rounded-lg text-sm font-bold text-slate-500">Tulis</button>
            </div>

            <div id="wrapperCamera">
                <form id="cameraForm" class="space-y-4">
                    <div class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-8 text-center relative hover:bg-slate-50 dark:hover:bg-slate-900/30 transition">
                        <input type="file" id="cameraFile" accept="image/*" capture="environment" class="absolute inset-0 opacity-0 cursor-pointer">
                        <div id="camPlaceholder">
                            <i class="fa-solid fa-camera text-4xl text-slate-300 mb-2"></i>
                            <p class="text-sm font-bold">Ambil Foto Makanan</p>
                        </div>
                        <img id="cameraPreview" class="hidden mx-auto max-h-48 rounded-lg shadow-md">
                    </div>
                    <button type="submit" id="btnSubmitCamera" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Analisis Foto</button>
                </form>
            </div>

            <div id="wrapperWrite" class="hidden">
                <form id="writeForm" class="space-y-4">
                    <textarea id="foodInput" rows="3" class="w-full p-4 rounded-2xl border border-slate-200 dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: Nasi goreng telur porsi dikit..."></textarea>
                    <button type="submit" id="btnSubmitWrite" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30">Analisis Teks</button>
                </form>
            </div>
        </section>

        <!-- DASHBOARD -->
        <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-8" id="dashboardGrid">
             <!-- Diisi oleh JS -->
        </div>

        <!-- RIWAYAT -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-md overflow-hidden">
            <div class="p-4 border-b dark:border-slate-700 flex justify-between items-center">
                <h3 class="font-bold">Riwayat Hari Ini</h3>
                <button onclick="fetchData()" class="text-blue-500 text-xs font-bold">Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <tbody id="riwayatTableBody" class="divide-y dark:divide-slate-700">
                        <!-- Diisi oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Pop-up Analisis AI -->
    <div id="nutritionModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-950 w-full max-w-md rounded-3xl p-6 shadow-2xl">
            <h3 class="text-xl font-bold text-center mb-4" id="modalFoodTitle">Hasil Analisis</h3>
            <div id="modalStats" class="grid grid-cols-3 gap-2 mb-6 text-center">
                <!-- Diisi JS -->
            </div>
            <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl mb-6">
                <p id="modalConclusion" class="text-sm text-blue-800 dark:text-blue-300"></p>
            </div>
            <button id="btnConfirmSave" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold mb-2">Simpan ke Jurnal</button>
            <button onclick="closeModal()" class="w-full py-2 text-slate-400 font-bold">Batal</button>
        </div>
    </div>

    <script>
        const tabCamera = document.getElementById("tabCamera");
        const tabWrite = document.getElementById("tabWrite");
        const wrapperCamera = document.getElementById("wrapperCamera");
        const wrapperWrite = document.getElementById("wrapperWrite");

        tabCamera.onclick = () => {
            tabCamera.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-slate-800 shadow text-blue-600";
            tabWrite.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-500";
            wrapperCamera.classList.remove("hidden");
            wrapperWrite.classList.add("hidden");
        };
        tabWrite.onclick = () => {
            tabWrite.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-white dark:bg-slate-800 shadow text-blue-600";
            tabCamera.className = "flex-1 py-2 rounded-lg text-sm font-bold text-slate-500";
            wrapperWrite.classList.remove("hidden");
            wrapperCamera.classList.add("hidden");
        };

        const cameraFile = document.getElementById("cameraFile");
        const cameraPreview = document.getElementById("cameraPreview");
        const camPlaceholder = document.getElementById("camPlaceholder");

        cameraFile.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    cameraPreview.src = ev.target.result;
                    cameraPreview.classList.remove("hidden");
                    camPlaceholder.classList.add("hidden");
                }
                reader.readAsDataURL(file);
            }
        };

        let temporaryAiData = null;
        let currentRawInput = "";

        async function fetchData() {
            try {
                const res = await fetch(GAS_WEB_APP_URL);
                const data = await res.json();
                if(data.status === "success") {
                    document.getElementById("aiAdviceTitle").innerText = "Saran Masak Sehat";
                    document.getElementById("aiMotivationText").innerText = `"${data.motivation}"`;
                    document.getElementById("aiRecipeText").innerText = data.recipe;
                    renderDashboard(data.dashboard);
                    renderRiwayat(data.riwayat);
                }
            } catch (e) { console.error(e); }
        }

        function renderDashboard(db) {
            const items = [
                {l: 'Kalori', v: db.kalori_hari_ini, u: 'kkal', c: 'text-orange-500'},
                {l: 'Protein', v: db.protein, u: 'g', c: 'text-blue-500'},
                {l: 'Karbo', v: db.karbohidrat, u: 'g', c: 'text-amber-500'},
                {l: 'Lemak', v: db.lemak, u: 'g', c: 'text-red-500'},
                {l: 'Serat', v: db.serat, u: 'g', c: 'text-green-500'},
                {l: 'Air', v: db.air, u: 'ml', c: 'text-cyan-500'}
            ];
            document.getElementById("dashboardGrid").innerHTML = items.map(i => `
                <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">${i.l}</p>
                    <p class="text-lg font-black ${i.c}">${i.v || 0}<span class="text-[10px] ml-0.5">${i.u}</span></p>
                </div>
            `).join('');
        }

        function renderRiwayat(list) {
            const body = document.getElementById("riwayatTableBody");
            if(!list || list.length === 0) {
                body.innerHTML = `<tr><td class="p-8 text-center text-slate-400">Belum ada data.</td
